<title>Eggless Cakes & Pastries Banner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{padding:20px;background:#f9fafb}
.banner{max-width:1200px;margin:0 auto;border-radius:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed,#ec4899);color:#fff;padding:50px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(124,58,237,.25)}
h1{font-size:3.5rem;font-weight:900;margin-bottom:15px;line-height:1.1}
p{font-size:1.5rem;margin-bottom:30px;opacity:.98}
.btn{background:#fff;color:#7c3aed;padding:18px 54px;border-radius:999px;text-decoration:none;font-weight:900;font-size:1.1rem;display:inline-block;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.cake-img{position:absolute;right:50px;bottom:40px;width:340px;height:290px;border-radius:14px;object-fit:cover;box-shadow:0 10px 40px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.5)}
.logo{position:absolute;top:30px;right:50px;width:90px;height:90px;opacity:.98}
@media(max-width:900px){.cake-img,.logo{display:none}h1{font-size:2.5rem}p{font-size:1.3rem}}

<!-- SITEWIDE-WEBSITE-SCHEMA -->
<script type="application/ld+json">
{

      "@type": "EntryPoint",

      "@type": "PropertyValueSpecification",

    }
  }
}
</script>

<body>
<div class="banner">
