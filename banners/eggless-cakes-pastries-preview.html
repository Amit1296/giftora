<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eggless Cakes & Pastries - Banner Previews</title>
<style>
body{font-family:Poppins,system-ui,sans-serif;background:#f8fafc;margin:0;padding:2rem;color:#1f2937}
h1{text-align:center;margin-bottom:2rem;font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2rem}
.card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.banner{border-radius:12px;overflow:hidden}
img{width:100%;display:block;height:auto}
h2{margin:0 0 1rem;font-size:1.25rem;font-weight:600}
</style>
</head>
<body>
<h1>6 Eggless Cakes & Pastries Banner Previews</h1>
<div class="grid">
  <div class="card"><h2>1. Royal Purple-Pink</h2><div class="banner"><img src="eggless-pastry-1.svg" alt="Eggless Cakes & Pastries Banner 1"></div></div>
  <div class="card"><h2>2. Fresh Mint Green</h2><div class="banner"><img src="eggless-pastry-2.svg" alt="Eggless Cakes & Pastries Banner 2"></div></div>
  <div class="card"><h2>3. Vibrant Orange-Yellow</h2><div class="banner"><img src="eggless-pastry-3.svg" alt="Eggless Cakes & Pastries Banner 3"></div></div>
  <div class="card"><h2>4. Teal Turquoise</h2><div class="banner"><img src="eggless-pastry-4.svg" alt="Eggless Cakes & Pastries Banner 4"></div></div>
  <div class="card"><h2>5. Fuchsia Pink</h2><div class="banner"><img src="eggless-pastry-5.svg" alt="Eggless Cakes & Pastries Banner 5"></div></div>
  <div class="card"><h2>6. Cool Blue Gradient</h2><div class="banner"><img src="eggless-pastry-6.svg" alt="Eggless Cakes & Pastries Banner 6"></div></div>
</div>
</body>
</html>
