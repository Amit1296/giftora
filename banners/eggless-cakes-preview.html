<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eggless Cakes Banner Previews</title>
<style>
body{font-family:Poppins,system-ui,sans-serif;background:#f8fafc;margin:0;padding:2rem;color:#1f2937}
h1{text-align:center;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2rem}
.card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.banner{border-radius:12px;overflow:hidden}
img{width:100%;display:block;height:auto}
h2{margin:0 0 1rem;font-size:1.25rem}
</style>
</head>
<body>
<h1>5 Eggless Cakes Banner Previews</h1>
<div class="grid">
  <div class="card"><h2>1. Purple-Pink Gradient</h2><div class="banner"><img src="eggless-style1.svg" alt="Eggless Cakes Banner 1"></div></div>
  <div class="card"><h2>2. Fresh Green</h2><div class="banner"><img src="eggless-style2.svg" alt="Eggless Cakes Banner 2"></div></div>
  <div class="card"><h2>3. Vibrant Orange</h2><div class="banner"><img src="eggless-style3.svg" alt="Eggless Cakes Banner 3"></div></div>
  <div class="card"><h2>4. Golden Amber</h2><div class="banner"><img src="eggless-style4.svg" alt="Eggless Cakes Banner 4"></div></div>
  <div class="card"><h2>5. Soft Lavender</h2><div class="banner"><img src="eggless-style5.svg" alt="Eggless Cakes Banner 5"></div></div>
</div>
</body>
</html>
