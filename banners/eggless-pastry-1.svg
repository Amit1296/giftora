  <text x="700" y="42%" font-size="24" font-family="Poppins,Arial,sans-serif" fill="#fff" text-anchor="middle" opacity=".95">Freshly Baked • Soft &amp; Delicious</text>
  <text x="700" y="58%" font-size="22" font-family="Poppins,Arial,sans-serif" fill="#fbbf24" text-anchor="middle" font-weight="700" filter="url(#glow)">Birthday Special - 15% OFF | Use Code: BDAY15</text>
  <rect x="550" y="290" width="300" height="70" rx="35" fill="#fff" opacity=".98"/>
  <text x="700" y="335" font-size="20" font-family="Poppins,Arial,sans-serif" fill="#7c3aed" text-anchor="middle" font-weight="700">Order Fresh Now</text>
