<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="img1" patternUnits="userSpaceOnUse" width="450" height="400" x="20" y="0">
      <image href="../uploads/img_2026_08_08_17_14_241d404b.png" width="450" height="400" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#g1)"/>
  <g>
    <rect x="20" y="20" width="410" height="360" rx="16" fill="url(#img1)" opacity="0.98"/>
    <image href="../logos/giftora-logo.svg" x="40" y="40" width="90" height="90" opacity="0.95"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -5,-3; 0,0" dur="5s" repeatCount="indefinite"/>
  </g>
