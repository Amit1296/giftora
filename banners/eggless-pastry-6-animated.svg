<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="img" patternUnits="userSpaceOnUse" width="450" height="400" x="20" y="0">
      <image href="../uploads/img_2026_08_08_17_14_241d404b.png" width="450" height="400" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <animateTransform id="a" attributeName="transform" type="translate" values="0 0; 10 5; 0 0" dur="4s" repeatCount="indefinite"/>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#g)"/>
  <g transform="translate(0,0)">
    <rect x="20" y="20" width="410" height="360" rx="16" fill="url(#img)" opacity="0.98"/>
    <image href="../logos/giftora-logo.svg" x="40" y="40" width="90" height="90" opacity="0.95"/>
  </g>
  <text x="700" y="25%" font-size="44" font-family="Poppins,Arial,sans-serif" fill="#fff" text-anchor="middle" font-weight="700" filter="url(#glow)">Eggless Cakes &amp; Pastries</text>
  <text x="700" y="42%" font-size="24" font-family="Poppins,Arial,sans-serif" fill="#fff" text-anchor="middle" opacity=".95">Freshly Baked • Soft &amp; Delicious</text>
  <text x="700" y="58%" font-size="22" font-family="Poppins,Arial,sans-serif" fill="#fbbf24" text-anchor="middle" font-weight="700" filter="url(#glow)">Birthday Special - 15% OFF | Use Code: BDAY15</text>
  <rect x="550" y="290" width="300" height="70" rx="35" fill="#fff" opacity=".98"/>
  <text x="700" y="335" font-size="20" font-family="Poppins,Arial,sans-serif" fill="#7c3aed" text-anchor="middle" font-weight="700">Order Fresh Now</text>
  <circle cx="980" cy="100" r="4" fill="#fff" opacity="0.8"><animate attributeName="cy" values="100;110;100" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="130" r="3" fill="#fff" opacity="0.6"><animate attributeName="cy" values="130;140;130" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="150" r="3.5" fill="#fff" opacity="0.7"><animate attributeName="cy" values="150;160;150" dur="4s" repeatCount="indefinite"/></circle>
</svg>