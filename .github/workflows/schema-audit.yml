name: Schema Audit

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Product schema
        run: node seo/check-schema.js
